<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Casino Marble Race</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080a14;overflow:hidden;font-family:'Segoe UI',sans-serif;color:#fff}
canvas{display:block}
.panel{background:rgba(10,14,28,.75);backdrop-filter:blur(12px);border:1px solid rgba(100,140,255,.15);border-radius:12px}
#topbar{position:fixed;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:18px;padding:10px 28px;font-size:14px;z-index:10;white-space:nowrap}
#topbar span{display:inline-block}
.lbl{opacity:.5;font-size:11px;margin-right:4px}
#status{color:#66d9ff;font-weight:700}
#timer{color:#fff;font-variant-numeric:tabular-nums}
#pot{color:#ffd94a;font-weight:700}
#count{color:#999}
#countdown{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(1);font-size:120px;font-weight:900;color:#66d9ff;text-shadow:0 0 40px #0af,0 0 80px #06a;z-index:20;transition:transform .25s,opacity .2s;opacity:0;pointer-events:none}
#countdown.show{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
#winner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);padding:32px 48px;text-align:center;z-index:20;border:2px solid #ffd94a;transition:transform .4s cubic-bezier(.17,.67,.35,1.3);pointer-events:none}
#winner.show{transform:translate(-50%,-50%) scale(1)}
#winner h2{color:#ffd94a;font-size:28px;margin-bottom:8px}
#winner .dot{width:20px;height:20px;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:8px;box-shadow:0 0 10px currentColor}
#winner .payout{color:#ffd94a;font-size:22px;margin-top:8px}
#results{position:fixed;right:16px;top:80px;width:180px;padding:14px;z-index:10;display:none;max-height:70vh;overflow-y:auto;font-size:13px}
#results h3{color:#66d9ff;font-size:13px;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
#results li{list-style:none;padding:3px 0;display:flex;align-items:center;gap:6px}
#results .ri{color:#666;width:18px;text-align:right;font-size:11px}
#results .rd{width:10px;height:10px;border-radius:50%;flex-shrink:0}
#brand{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:rgba(255,255,255,.25);letter-spacing:3px;z-index:10}
</style>
</head>
<body>
<div id="topbar" class="panel">
  <span><span class="lbl">STATUS</span><span id="status">WAITING</span></span>
  <span><span class="lbl">TIME</span><span id="timer">0.00s</span></span>
  <span><span class="lbl">POT</span><span id="pot">$1,200</span></span>
  <span><span class="lbl">RACERS</span><span id="count">0/12</span></span>
</div>
<div id="countdown"></div>
<div id="winner" class="panel"><h2>WINNER</h2><div id="winfo"></div><div class="payout" id="wpay"></div></div>
<div id="results" class="panel"><h3>Results</h3><ol id="rlist"></ol></div>
<div id="brand">MARBLES &nbsp;|&nbsp; Provably Fair</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/","cannon-es":"https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"}}</script>
<script type="module">
import*as T from'three';
import*as C from'cannon-es';
const PI=Math.PI,W=window,D=document;
const NAMES=['Ruby','Ember','Solar','Jade','Aqua','Cobalt','Violet','Orchid','Blush','Onyx','Pearl','Lime'];
const COLS=[0xff2244,0xff6622,0xffaa00,0x22cc66,0x22dddd,0x3366ff,0x8833ff,0xff44cc,0xff6699,0x222233,0xeeeeff,0x88ff22];
const SEGS=5,SL=18,SW=3.2,WT=0.25,MR=0.3,MN=12;
const YAW=[0,18,-18,-18,18],TILT=14;
let scene,cam,renderer,world,marbles=[],bodies=[],lights=[];
let finished=[],raceOn=false,t0=0,done=false;
// Track geometry
function bSeg(i,ox,oz,a){
  const ra=a*PI/180,tr=TILT*PI/180*(i%2?1:-1);
  const g=new T.Group();g.position.set(ox,0,oz);g.rotation.y=ra;
  // deck
  const dm=new T.MeshStandardMaterial({color:0x1a1e2e,metalness:.5,roughness:.3});
  const dk=new T.Mesh(new T.BoxGeometry(SW,0.15,SL),dm);
  dk.position.set(0,-.08,SL/2);dk.rotation.x=tr;dk.receiveShadow=true;g.add(dk);
  // walls
  const wm=new T.MeshStandardMaterial({color:0x12141f,metalness:.4,roughness:.4});
  for(let s=-1;s<=1;s+=2){
    const w=new T.Mesh(new T.BoxGeometry(WT,0.5,SL),wm);
    w.position.set(s*(SW/2+WT/2),0.15,SL/2);w.rotation.x=tr;w.receiveShadow=true;g.add(w);
    // neon strip
    const nc=s<0?0x00ccff:0xff00cc;
    const nm=new T.MeshStandardMaterial({color:nc,emissive:nc,emissiveIntensity:3});
    const ns=new T.Mesh(new T.BoxGeometry(WT,0.04,SL),nm);
    ns.position.set(s*(SW/2+WT/2),0.42,SL/2);ns.rotation.x=tr;g.add(ns);
  }
  scene.add(g);
  // physics
  const cy=Math.cos(tr),sy=Math.sin(tr),ca=Math.cos(ra),sa=Math.sin(ra);
  const cz=SL/2*ca,cx=-SL/2*sa;
  const addB=(px,py,pz,sx2,sy2,sz2)=>{
    const b=new C.Body({mass:0,shape:new C.Box(new C.Vec3(sx2,sy2,sz2))});
    const q=new C.Quaternion();q.setFromEuler(tr,ra,0,'YXZ');
    b.quaternion.copy(q);
    b.position.set(ox+px*ca-pz*sa,py*cy-pz*sy*0+py*0+(-pz*sy+py*cy)*0+py, oz+px*sa+pz*ca);
    // simplified pos
    const lx=px,ly=py,lz=pz;
    const ry=ly*cy-lz*sy,rz=ly*sy+lz*cy;
    b.position.set(ox+lx*ca-rz*sa,ry,oz+lx*sa+rz*ca);
    world.addBody(b);
  };
  addB(0,-0.08,SL/2,SW/2,0.08,SL/2);
  addB(-SW/2-WT/2,0.15,SL/2,WT/2,0.25,SL/2);
  addB(SW/2+WT/2,0.15,SL/2,WT/2,0.25,SL/2);
  // return end pos
  const ez=SL*cy,ey=-SL*sy;
  return{x:ox-SL*sa*1,y:ey,z:oz+SL*ca*1,a:a};
}
function init(){
  // renderer
  renderer=new T.WebGLRenderer({antialias:true});
  renderer.setSize(W.innerWidth,W.innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=T.PCFSoftShadowMap;
  renderer.toneMapping=T.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.2;
  D.body.prepend(renderer.domElement);
  // scene
  scene=new T.Scene();
  scene.background=new T.Color(0x080a14);
  scene.fog=new T.FogExp2(0x0c0818,0.006);
  // camera
  cam=new T.PerspectiveCamera(55,W.innerWidth/W.innerHeight,0.1,500);
  cam.position.set(0,8,-6);
  // lights
  const sl=new T.SpotLight(0xffffff,3,0,PI/5,0.5);
  sl.position.set(0,30,20);sl.castShadow=true;
  sl.shadow.mapSize.set(1024,1024);scene.add(sl);
  scene.add(new T.HemisphereLight(0x334466,0x080810,0.3));
  // ground
  const gm=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshStandardMaterial({color:0x0a0c14,metalness:.7,roughness:.2}));
  gm.rotation.x=-PI/2;gm.position.y=-1;gm.receiveShadow=true;scene.add(gm);
  // physics world
  world=new C.World({gravity:new C.Vec3(0,-9.82,0)});
  world.broadphase=new C.NaiveBroadphase();
  const gp=new C.Body({mass:0,shape:new C.Plane()});
  gp.quaternion.setFromEuler(-PI/2,0,0);gp.position.y=-1;world.addBody(gp);
  // build track
  let ox=0,oz=0,ang=0;
  const segs=[];
  for(let i=0;i<SEGS;i++){
    ang+=YAW[i];
    const s=bSeg(i,ox,oz,ang);
    segs.push({sx:ox,sz:oz,ex:s.x,ey:s.y,ez:s.z,a:ang});
    ox=s.x;oz=s.z;
  }
  // finish line
  const la=segs[SEGS-1];
  const fa=la.a*PI/180;
  const fm=new T.MeshStandardMaterial({color:0xffd94a,emissive:0xffd94a,emissiveIntensity:1,transparent:true,opacity:0.6});
  const fp=new T.Mesh(new T.PlaneGeometry(SW+1,0.3),fm);
  fp.rotation.x=-PI/2;fp.rotation.z=-fa;
  fp.position.set(la.ex,0.01,la.ez);scene.add(fp);
  W._fm=fm;W._fz=la.ez;W._fx=la.ex;W._fa=fa;
  // marbles
  for(let i=0;i<MN;i++){
    const c=COLS[i];
    const m=new T.Mesh(new T.SphereGeometry(MR,24,24),new T.MeshStandardMaterial({color:c,metalness:.8,roughness:.15}));
    m.castShadow=true;scene.add(m);
    const pl=new T.PointLight(c,0.5,3);m.add(pl);lights.push(pl);
    marbles.push(m);
    const b=new C.Body({mass:1,shape:new C.Sphere(MR),linearDamping:0.1,angularDamping:0.3});
    const row=Math.floor(i/4),col=i%4;
    b.position.set(-1.2+col*0.8,1+row*0.7,1);
    b.type=C.Body.STATIC;
    world.addBody(b);bodies.push(b);
  }
  D.getElementById('count').textContent=MN+'/'+MN;
  W.addEventListener('resize',()=>{cam.aspect=W.innerWidth/W.innerHeight;cam.updateProjectionMatrix();renderer.setSize(W.innerWidth,W.innerHeight)});
  countdown();
  animate();
}
function countdown(){
  const el=D.getElementById('countdown'),st=D.getElementById('status');
  st.textContent='COUNTDOWN';
  const seq=['3','2','1','GO!'];
  let i=0;
  const nx=()=>{
    if(i>=seq.length){el.classList.remove('show');startRace();return}
    el.textContent=seq[i];el.classList.remove('show');
    void el.offsetWidth;el.classList.add('show');
    if(seq[i]==='GO!')el.style.color='#ffd94a';
    i++;setTimeout(nx,900);
  };
  setTimeout(nx,600);
}
function startRace(){
  raceOn=true;t0=performance.now();
  D.getElementById('status').textContent='RACING';
  bodies.forEach(b=>{b.type=C.Body.DYNAMIC;b.wakeUp()});
}
function getLeader(){
  let best=null,bz=-Infinity;
  for(let i=0;i<MN;i++){
    if(bodies[i].position.z>bz){bz=bodies[i].position.z;best=i}
  }
  return best;
}
function checkFinish(){
  const fz=W._fz,fx=W._fx,fa=W._fa;
  for(let i=0;i<MN;i++){
    if(finished.includes(i))continue;
    const p=bodies[i].position;
    const dx=p.x-fx,dz=p.z-fz;
    const along=dx*(-Math.sin(fa))+dz*Math.cos(fa);
    if(along>1)finished.push(i);
  }
  if(finished.length>0&&!done){
    done=true;
    D.getElementById('status').textContent='FINISHED';
    showWinner(finished[0]);
  }
  if(finished.length===MN&&!W._allDone){
    W._allDone=true;showResults();
  }
}
function showWinner(i){
  const el=D.getElementById('winner'),inf=D.getElementById('winfo'),pay=D.getElementById('wpay');
  const c='#'+COLS[i].toString(16).padStart(6,'0');
  inf.innerHTML=`<span class="dot" style="background:${c};color:${c}"></span><span style="font-size:22px">${NAMES[i]}</span>`;
  pay.textContent='Payout: $'+((1200*0.9)|0);
  setTimeout(()=>el.classList.add('show'),300);
  setTimeout(()=>{el.classList.remove('show');showResults()},4000);
}
function showResults(){
  const el=D.getElementById('results'),ol=D.getElementById('rlist');
  ol.innerHTML='';
  finished.forEach((mi,idx)=>{
    const c='#'+COLS[mi].toString(16).padStart(6,'0');
    const li=D.createElement('li');
    li.innerHTML=`<span class="ri">${idx+1}</span><span class="rd" style="background:${c}"></span>${NAMES[mi]}`;
    ol.appendChild(li);
  });
  el.style.display='block';
}
const cp={x:0,y:8,z:-6},ct={x:0,y:0,z:4};
function animate(){
  requestAnimationFrame(animate);
  if(raceOn){
    world.step(1/60);
    for(let i=0;i<MN;i++){
      const p=bodies[i].position,q=bodies[i].quaternion;
      marbles[i].position.set(p.x,p.y,p.z);
      marbles[i].quaternion.set(q.x,q.y,q.z,q.w);
    }
    checkFinish();
    const elapsed=((performance.now()-t0)/1000).toFixed(2);
    D.getElementById('timer').textContent=elapsed+'s';
    // camera follow
    const li=getLeader();
    if(li!==null){
      const p=bodies[li].position;
      const tx=p.x-3,ty=p.y+4,tz=p.z-6;
      cp.x+=(tx-cp.x)*0.03;cp.y+=(ty-cp.y)*0.03;cp.z+=(tz-cp.z)*0.03;
      ct.x+=(p.x-ct.x)*0.05;ct.y+=(p.y-ct.y)*0.05;ct.z+=(p.z-ct.z)*0.05;
    }
  }
  cam.position.set(cp.x,cp.y,cp.z);
  cam.lookAt(ct.x,ct.y,ct.z);
  // pulse finish
  if(W._fm)W._fm.emissiveIntensity=1+Math.sin(performance.now()/1000*3)*0.5;
  renderer.render(scene,cam);
}
init();
</script>
</body>
</html>
