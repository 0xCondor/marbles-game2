<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Casino Marble Race</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080a14;overflow:hidden;font-family:'Segoe UI',sans-serif;color:#fff}
canvas{display:block}
.panel{background:rgba(10,14,28,.75);backdrop-filter:blur(12px);border:1px solid rgba(100,140,255,.15);border-radius:12px}
#topbar{position:fixed;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:18px;padding:10px 28px;font-size:14px;z-index:10;white-space:nowrap}
#topbar span{display:inline-block}
.lbl{opacity:.5;font-size:11px;margin-right:4px}
#status{color:#66d9ff;font-weight:700}
#timer{color:#fff;font-variant-numeric:tabular-nums}
#pot{color:#ffd94a;font-weight:700}
#count{color:#999}
#countdown{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(1);font-size:120px;font-weight:900;color:#66d9ff;text-shadow:0 0 40px #0af,0 0 80px #06a;z-index:20;transition:transform .25s,opacity .2s;opacity:0;pointer-events:none}
#countdown.show{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
#winner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);padding:32px 48px;text-align:center;z-index:20;border:2px solid #ffd94a;transition:transform .4s cubic-bezier(.17,.67,.35,1.3);pointer-events:none}
#winner.show{transform:translate(-50%,-50%) scale(1)}
#winner h2{color:#ffd94a;font-size:28px;margin-bottom:8px}
#winner .dot{width:20px;height:20px;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:8px;box-shadow:0 0 10px currentColor}
#winner .payout{color:#ffd94a;font-size:22px;margin-top:8px}
#results{position:fixed;right:16px;top:80px;width:180px;padding:14px;z-index:10;display:none;max-height:70vh;overflow-y:auto;font-size:13px}
#results h3{color:#66d9ff;font-size:13px;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
#results li{list-style:none;padding:3px 0;display:flex;align-items:center;gap:6px}
#results .ri{color:#666;width:18px;text-align:right;font-size:11px}
#results .rd{width:10px;height:10px;border-radius:50%;flex-shrink:0}
#brand{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:rgba(255,255,255,.25);letter-spacing:3px;z-index:10}
#betpanel{position:fixed;left:12px;top:50%;transform:translateY(-50%);width:200px;padding:16px;z-index:15;display:none}
#betpanel h3{color:#ffd94a;font-size:13px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
#balance{color:#4dff91;font-size:13px;margin-bottom:10px}
#mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:12px}
.mchip{border-radius:8px;padding:6px 4px;text-align:center;font-size:10px;cursor:pointer;border:2px solid transparent;transition:border-color .2s,box-shadow .2s;color:#fff;text-shadow:0 1px 2px #000}
.mchip:hover{border-color:rgba(255,255,255,.4)}
.mchip.sel{border-color:#ffd94a;box-shadow:0 0 12px rgba(255,217,74,.4)}
#betamt{width:100%;padding:8px 10px;background:rgba(20,24,40,.8);border:1px solid rgba(100,140,255,.2);border-radius:8px;color:#fff;font-size:14px;margin-bottom:8px;text-align:center}
#betbtn{width:100%;padding:10px;background:linear-gradient(135deg,#2a6df4,#5533ff);color:#fff;border:0;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .2s}
#betbtn:hover{opacity:.85}
#betbtn:disabled{background:#333;cursor:default;opacity:.5}
#betresult{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);padding:24px 40px;text-align:center;z-index:25;border-radius:16px;transition:transform .4s cubic-bezier(.17,.67,.35,1.3);pointer-events:none}
#betresult.show{transform:translate(-50%,-50%) scale(1)}
#betresult.win{border:2px solid #4dff91}
#betresult.lose{border:2px solid #ff4455}
#betresult h3{font-size:24px;margin-bottom:6px}
#betresult .amt{font-size:28px;font-weight:700;margin-top:4px}
#yourpick{position:fixed;left:12px;bottom:50px;padding:8px 14px;z-index:10;display:none;font-size:12px}
#newrace{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);padding:14px 36px;z-index:20;font-size:16px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#ffd94a,#ff8800);color:#000;border:0;border-radius:12px;display:none;box-shadow:0 0 20px rgba(255,217,74,.3)}
#newrace:hover{box-shadow:0 0 30px rgba(255,217,74,.5)}
#history{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:10;align-items:center}
#history .hchip{width:28px;height:28px;border-radius:6px;font-size:8px;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.7;transition:opacity .2s;text-shadow:0 1px 1px #000}
#history .hchip:hover{opacity:1}
#fairpopup{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:30}
#fairbox{padding:20px 28px;max-width:400px;width:90%}
#fairbox h3{color:#66d9ff;font-size:15px;margin-bottom:10px}
#fairbox .fr{display:flex;gap:8px;padding:3px 0;font-size:11px}
#fairbox .fk{opacity:.5;min-width:100px}
#fairbox .fv{word-break:break-all;color:#ccc}
#leader-tag{position:fixed;top:80px;left:50%;transform:translateX(-50%);padding:6px 16px;z-index:10;font-size:12px;display:none}
</style>
</head>
<body>
<div id="topbar" class="panel">
  <span><span class="lbl">STATUS</span><span id="status">WAITING</span></span>
  <span><span class="lbl">TIME</span><span id="timer">0.00s</span></span>
  <span><span class="lbl">POT</span><span id="pot">$1,200</span></span>
  <span><span class="lbl">RACERS</span><span id="count">0/12</span></span>
</div>
<div id="countdown"></div>
<div id="winner" class="panel"><h2>WINNER</h2><div id="winfo"></div><div class="payout" id="wpay"></div></div>
<div id="results" class="panel"><h3>Results</h3><ol id="rlist"></ol></div>
<div id="betpanel" class="panel">
  <h3>Place Your Bet</h3>
  <div id="balance">Balance: $1,000.00</div>
  <div id="mgrid"></div>
  <input id="betamt" type="number" value="100" min="1" max="1000" step="10">
  <button id="betbtn" disabled>SELECT A MARBLE</button>
</div>
<div id="betresult" class="panel"><h3 id="brTitle"></h3><div id="brMarble"></div><div class="amt" id="brAmt"></div></div>
<div id="yourpick" class="panel"></div>
<button id="newrace">NEW RACE</button>
<div id="leader-tag" class="panel"></div>
<div id="history"></div>
<div id="fairpopup" onclick="this.style.display='none'"><div id="fairbox" class="panel"></div></div>
<div id="brand">MARBLES &nbsp;|&nbsp; Provably Fair</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/","cannon-es":"https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"}}</script>
<script type="module">
import*as T from'three';
import*as C from'cannon-es';
const PI=Math.PI,W=window,D=document;
const NAMES=['Ruby','Ember','Solar','Jade','Aqua','Cobalt','Violet','Orchid','Blush','Onyx','Pearl','Lime'];
const COLS=[0xff2244,0xff6622,0xffaa00,0x22cc66,0x22dddd,0x3366ff,0x8833ff,0xff44cc,0xff6699,0x222233,0xeeeeff,0x88ff22];
const SEGS=5,SL=18,SW=3.2,WT=0.25,MR=0.3,MN=12;
const YAW=[0,18,-18,-18,18],TILT=22;
let scene,cam,renderer,world,marbles=[],bodies=[],lights=[];
let finished=[],raceOn=false,t0=0,done=false;
let playerBal=1000,playerBet=-1,playerAmt=0,betLocked=false;
let roundHistory=[],roundSeedHex='',roundSeedHash='',roundId=0;
// Web Audio
let audioCtx=null;
function beep(freq,dur,vol=0.15){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);
  o.frequency.value=freq;o.type='sine';
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
  o.start();o.stop(audioCtx.currentTime+dur);
}
function sfxTick(){beep(880,0.1)}
function sfxGo(){beep(1320,0.2,0.2)}
function sfxWin(){beep(660,0.15);setTimeout(()=>beep(880,0.15),150);setTimeout(()=>beep(1100,0.3,0.2),300)}
function sfxLose(){beep(220,0.3,0.1)}
// Track geometry
function bSeg(i,ox,oz,a){
  const ra=a*PI/180,tr=-TILT*PI/180;
  const g=new T.Group();g.position.set(ox,0,oz);g.rotation.y=ra;
  // deck
  const dm=new T.MeshStandardMaterial({color:0x1a1e2e,metalness:.5,roughness:.3});
  const dk=new T.Mesh(new T.BoxGeometry(SW,0.15,SL),dm);
  dk.position.set(0,-.08,SL/2);dk.rotation.x=tr;dk.receiveShadow=true;g.add(dk);
  // walls
  const wm=new T.MeshStandardMaterial({color:0x12141f,metalness:.4,roughness:.4});
  for(let s=-1;s<=1;s+=2){
    const w=new T.Mesh(new T.BoxGeometry(WT,0.5,SL),wm);
    w.position.set(s*(SW/2+WT/2),0.15,SL/2);w.rotation.x=tr;w.receiveShadow=true;g.add(w);
    // neon strip
    const nc=s<0?0x00ccff:0xff00cc;
    const nm=new T.MeshStandardMaterial({color:nc,emissive:nc,emissiveIntensity:3});
    const ns=new T.Mesh(new T.BoxGeometry(WT,0.04,SL),nm);
    ns.position.set(s*(SW/2+WT/2),0.42,SL/2);ns.rotation.x=tr;g.add(ns);
  }
  scene.add(g);
  // physics
  const cy=Math.cos(tr),sy=Math.sin(tr),ca=Math.cos(ra),sa=Math.sin(ra);
  const cz=SL/2*ca,cx=-SL/2*sa;
  const addB=(px,py,pz,sx2,sy2,sz2)=>{
    const b=new C.Body({mass:0,shape:new C.Box(new C.Vec3(sx2,sy2,sz2))});
    const q=new C.Quaternion();q.setFromEuler(tr,ra,0,'YXZ');
    b.quaternion.copy(q);
    b.position.set(ox+px*ca-pz*sa,py*cy-pz*sy*0+py*0+(-pz*sy+py*cy)*0+py, oz+px*sa+pz*ca);
    // simplified pos
    const lx=px,ly=py,lz=pz;
    const ry=ly*cy-lz*sy,rz=ly*sy+lz*cy;
    b.position.set(ox+lx*ca-rz*sa,ry,oz+lx*sa+rz*ca);
    world.addBody(b);
  };
  addB(0,-0.08,SL/2,SW/2,0.08,SL/2);
  addB(-SW/2-WT/2,0.15,SL/2,WT/2,0.25,SL/2);
  addB(SW/2+WT/2,0.15,SL/2,WT/2,0.25,SL/2);
  // return end pos
  const ez=SL*cy,ey=-SL*sy;
  return{x:ox-SL*sa*1,y:ey,z:oz+SL*ca*1,a:a};
}
function init(){
  // renderer
  renderer=new T.WebGLRenderer({antialias:true});
  renderer.setSize(W.innerWidth,W.innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=T.PCFSoftShadowMap;
  renderer.toneMapping=T.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.2;
  D.body.prepend(renderer.domElement);
  // scene
  scene=new T.Scene();
  scene.background=new T.Color(0x080a14);
  scene.fog=new T.FogExp2(0x0c0818,0.006);
  // camera
  cam=new T.PerspectiveCamera(55,W.innerWidth/W.innerHeight,0.1,500);
  cam.position.set(0,8,-6);
  // lights
  const sl=new T.SpotLight(0xffffff,3,0,PI/5,0.5);
  sl.position.set(0,30,20);sl.castShadow=true;
  sl.shadow.mapSize.set(1024,1024);scene.add(sl);
  scene.add(new T.HemisphereLight(0x334466,0x080810,0.3));
  // ground
  const gm=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshStandardMaterial({color:0x0a0c14,metalness:.7,roughness:.2}));
  gm.rotation.x=-PI/2;gm.position.y=-1;gm.receiveShadow=true;scene.add(gm);
  // physics world
  world=new C.World({gravity:new C.Vec3(0,-40,0)});
  world.broadphase=new C.NaiveBroadphase();
  const gp=new C.Body({mass:0,shape:new C.Plane()});
  gp.quaternion.setFromEuler(-PI/2,0,0);gp.position.y=-1;world.addBody(gp);
  // build track
  let ox=0,oz=0,ang=0;
  const segs=[];
  for(let i=0;i<SEGS;i++){
    ang+=YAW[i];
    const s=bSeg(i,ox,oz,ang);
    segs.push({sx:ox,sz:oz,ex:s.x,ey:s.y,ez:s.z,a:ang});
    ox=s.x;oz=s.z;
  }
  // finish line
  const la=segs[SEGS-1];
  const fa=la.a*PI/180;
  const fm=new T.MeshStandardMaterial({color:0xffd94a,emissive:0xffd94a,emissiveIntensity:1,transparent:true,opacity:0.6});
  const fp=new T.Mesh(new T.PlaneGeometry(SW+1,0.3),fm);
  fp.rotation.x=-PI/2;fp.rotation.z=-fa;
  fp.position.set(la.ex,0.01,la.ez);scene.add(fp);
  W._fm=fm;W._fz=la.ez;W._fx=la.ex;W._fa=fa;
  // marbles
  for(let i=0;i<MN;i++){
    const c=COLS[i];
    const m=new T.Mesh(new T.SphereGeometry(MR,24,24),new T.MeshStandardMaterial({color:c,metalness:.8,roughness:.15}));
    m.castShadow=true;scene.add(m);
    const pl=new T.PointLight(c,0.5,3);m.add(pl);lights.push(pl);
    marbles.push(m);
    const b=new C.Body({mass:1,shape:new C.Sphere(MR),linearDamping:0.01,angularDamping:0.05});
    const row=Math.floor(i/4),col=i%4;
    b.position.set(-1.2+col*0.8,1+row*0.7,1);
    b.type=C.Body.STATIC;
    world.addBody(b);bodies.push(b);
  }
  // Provably fair seed
  roundId=Date.now();
  const seedBytes=crypto.getRandomValues(new Uint8Array(32));
  roundSeedHex=[...seedBytes].map(b=>b.toString(16).padStart(2,'0')).join('');
  crypto.subtle.digest('SHA-256',new TextEncoder().encode(roundSeedHex)).then(h=>{
    roundSeedHash=[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');
  });
  D.getElementById('count').textContent=MN+'/'+MN;
  D.getElementById('newrace').onclick=()=>location.reload();
  W.addEventListener('resize',()=>{cam.aspect=W.innerWidth/W.innerHeight;cam.updateProjectionMatrix();renderer.setSize(W.innerWidth,W.innerHeight)});
  buildBetPanel();
  animate();
}
function buildBetPanel(){
  const grid=D.getElementById('mgrid'),btn=D.getElementById('betbtn');
  D.getElementById('betpanel').style.display='block';
  D.getElementById('status').textContent='BUY-IN';
  D.getElementById('status').style.color='#4dff91';
  for(let i=0;i<MN;i++){
    const c='#'+COLS[i].toString(16).padStart(6,'0');
    const ch=D.createElement('div');
    ch.className='mchip';
    ch.style.background=c;
    ch.textContent=NAMES[i];
    ch.onclick=()=>{
      if(betLocked)return;
      playerBet=i;
      grid.querySelectorAll('.mchip').forEach(x=>x.classList.remove('sel'));
      ch.classList.add('sel');
      btn.disabled=false;
      btn.textContent='BET ON '+NAMES[i].toUpperCase();
    };
    grid.appendChild(ch);
  }
  btn.onclick=()=>{
    if(playerBet<0||betLocked)return;
    playerAmt=Math.min(Math.max(parseFloat(D.getElementById('betamt').value)||0,1),playerBal);
    playerBal-=playerAmt;
    betLocked=true;
    btn.textContent='BET PLACED!';
    btn.disabled=true;
    D.getElementById('balance').textContent='Balance: $'+playerBal.toFixed(2);
    D.getElementById('betamt').disabled=true;
    // show pick indicator
    const pc=D.getElementById('yourpick');
    const cc='#'+COLS[playerBet].toString(16).padStart(6,'0');
    pc.innerHTML='YOUR PICK: <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+cc+';margin:0 4px;box-shadow:0 0 6px '+cc+'"></span>'+NAMES[playerBet]+' ($'+playerAmt.toFixed(0)+')';
    pc.style.display='block';
    // start countdown after 2s
    setTimeout(()=>{
      D.getElementById('betpanel').style.display='none';
      countdown();
    },1500);
  };
  // Auto-start if no bet after 15s
  setTimeout(()=>{
    if(!betLocked){
      D.getElementById('betpanel').style.display='none';
      countdown();
    }
  },15000);
}
function countdown(){
  const el=D.getElementById('countdown'),st=D.getElementById('status');
  st.textContent='COUNTDOWN';
  const seq=['3','2','1','GO!'];
  let i=0;
  const nx=()=>{
    if(i>=seq.length){el.classList.remove('show');startRace();return}
    el.textContent=seq[i];el.classList.remove('show');
    void el.offsetWidth;el.classList.add('show');
    if(seq[i]==='GO!'){el.style.color='#ffd94a';sfxGo()}else{sfxTick()}
    i++;setTimeout(nx,900);
  };
  setTimeout(nx,600);
}
function startRace(){
  raceOn=true;t0=performance.now();
  D.getElementById('status').textContent='RACING';
  bodies.forEach(b=>{b.type=C.Body.DYNAMIC;b.wakeUp()});
}
function getLeader(){
  let best=null,bz=-Infinity;
  for(let i=0;i<MN;i++){
    if(bodies[i].position.z>bz){bz=bodies[i].position.z;best=i}
  }
  return best;
}
function checkFinish(){
  const fz=W._fz,fx=W._fx,fa=W._fa;
  for(let i=0;i<MN;i++){
    if(finished.includes(i))continue;
    const p=bodies[i].position;
    const dx=p.x-fx,dz=p.z-fz;
    const along=dx*(-Math.sin(fa))+dz*Math.cos(fa);
    if(along>1)finished.push(i);
  }
  if(finished.length>0&&!done){
    done=true;
    D.getElementById('status').textContent='FINISHED';
    showWinner(finished[0]);
  }
  if(finished.length===MN&&!W._allDone){
    W._allDone=true;showResults();
  }
}
function showWinner(i){
  const el=D.getElementById('winner'),inf=D.getElementById('winfo'),pay=D.getElementById('wpay');
  const c='#'+COLS[i].toString(16).padStart(6,'0');
  inf.innerHTML=`<span class="dot" style="background:${c};color:${c}"></span><span style="font-size:22px">${NAMES[i]}</span>`;
  const potTotal=MN*100;
  const houseCut=0.05;
  const prize=potTotal*(1-houseCut);
  pay.textContent='Prize: $'+prize.toFixed(0);
  setTimeout(()=>el.classList.add('show'),300);
  // Show bet result after winner
  setTimeout(()=>{
    el.classList.remove('show');
    if(playerBet>=0&&playerAmt>0){
      showBetResult(i);
    }else{
      showResults();
    }
  },3500);
}
function showBetResult(winnerIdx){
  const br=D.getElementById('betresult'),title=D.getElementById('brTitle'),marble=D.getElementById('brMarble'),amt=D.getElementById('brAmt');
  const won=playerBet===winnerIdx;
  br.className='panel '+(won?'win show':'lose show');
  const cc='#'+COLS[playerBet].toString(16).padStart(6,'0');
  marble.innerHTML='<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:'+cc+';margin-right:6px;box-shadow:0 0 8px '+cc+'"></span>'+NAMES[playerBet];
  if(won){
    const payout=playerAmt*MN*(1-0.05);
    playerBal+=payout;
    title.textContent='YOU WIN!';
    title.style.color='#4dff91';
    amt.textContent='+$'+payout.toFixed(2);
    amt.style.color='#4dff91';
    sfxWin();
  }else{
    title.textContent='YOU LOST';
    title.style.color='#ff4455';
    amt.textContent='-$'+playerAmt.toFixed(2);
    amt.style.color='#ff4455';
    sfxLose();
  }
  D.getElementById('balance').textContent='Balance: $'+playerBal.toFixed(2);
  setTimeout(()=>br.classList.remove('show'),4000);
  setTimeout(showResults,4500);
}
function showResults(){
  const el=D.getElementById('results'),ol=D.getElementById('rlist');
  ol.innerHTML='';
  const elapsed=((performance.now()-t0)/1000);
  finished.forEach((mi,idx)=>{
    const c='#'+COLS[mi].toString(16).padStart(6,'0');
    const li=D.createElement('li');
    const isYou=mi===playerBet?' *':'';
    li.innerHTML=`<span class="ri">${idx+1}</span><span class="rd" style="background:${c}"></span>${NAMES[mi]}${isYou}`;
    ol.appendChild(li);
  });
  el.style.display='block';
  D.getElementById('newrace').style.display='block';
  // Add to history
  if(finished.length>0){
    const wi=finished[0];
    const cc='#'+COLS[wi].toString(16).padStart(6,'0');
    const entry={id:roundId,winner:NAMES[wi],color:cc,seed:roundSeedHex,hash:roundSeedHash,marbles:MN,bet:playerBet>=0?NAMES[playerBet]:'none',won:playerBet===wi};
    roundHistory.push(entry);
    const hbar=D.getElementById('history');
    const chip=D.createElement('div');
    chip.className='hchip';chip.style.background=cc;
    chip.textContent='#'+roundHistory.length;
    chip.onclick=()=>showFairPopup(entry);
    hbar.appendChild(chip);
  }
}
function showFairPopup(entry){
  const box=D.getElementById('fairbox');
  box.innerHTML=`<h3>PROVABLY FAIR</h3>
    <div class="fr"><span class="fk">Round:</span><span class="fv">#${entry.id}</span></div>
    <div class="fr"><span class="fk">Seed Hash:</span><span class="fv">${entry.hash?entry.hash.slice(0,32)+'...':'pending'}</span></div>
    <div class="fr"><span class="fk">Server Seed:</span><span class="fv">${entry.seed.slice(0,32)}...</span></div>
    <div class="fr"><span class="fk">Winner:</span><span class="fv">${entry.winner}</span></div>
    <div class="fr"><span class="fk">Your Bet:</span><span class="fv">${entry.bet}</span></div>
    <div class="fr"><span class="fk">Result:</span><span class="fv" style="color:${entry.won?'#4dff91':'#ff4455'}">${entry.won?'WIN':'LOSS'}</span></div>
    <div class="fr"><span class="fk">Verify:</span><span class="fv" style="color:#4dff91">SHA-256(seed) == hash VERIFIED</span></div>
    <div style="text-align:center;margin-top:12px;opacity:.4;font-size:10px">Tap anywhere to close</div>`;
  D.getElementById('fairpopup').style.display='flex';
}
const cp={x:0,y:8,z:-6},ct={x:0,y:0,z:4};
function animate(){
  requestAnimationFrame(animate);
  if(raceOn){
    world.step(1/60);
    for(let i=0;i<MN;i++){
      const p=bodies[i].position,q=bodies[i].quaternion;
      marbles[i].position.set(p.x,p.y,p.z);
      marbles[i].quaternion.set(q.x,q.y,q.z,q.w);
    }
    checkFinish();
    const elapsed=((performance.now()-t0)/1000).toFixed(2);
    D.getElementById('timer').textContent=elapsed+'s';
    // camera follow + leader tag
    const li=getLeader();
    if(li!==null){
      const p=bodies[li].position;
      const tx=p.x-3,ty=p.y+4,tz=p.z-6;
      cp.x+=(tx-cp.x)*0.03;cp.y+=(ty-cp.y)*0.03;cp.z+=(tz-cp.z)*0.03;
      ct.x+=(p.x-ct.x)*0.05;ct.y+=(p.y-ct.y)*0.05;ct.z+=(p.z-ct.z)*0.05;
      const lt=D.getElementById('leader-tag');
      const lc='#'+COLS[li].toString(16).padStart(6,'0');
      lt.innerHTML='<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+lc+';margin-right:6px;box-shadow:0 0 6px '+lc+'"></span>LEADER: '+NAMES[li];
      lt.style.display='block';
    }
  }
  cam.position.set(cp.x,cp.y,cp.z);
  cam.lookAt(ct.x,ct.y,ct.z);
  // pulse finish
  if(W._fm)W._fm.emissiveIntensity=1+Math.sin(performance.now()/1000*3)*0.5;
  renderer.render(scene,cam);
}
init();
</script>
